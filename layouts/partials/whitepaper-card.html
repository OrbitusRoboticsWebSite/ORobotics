<article class="wp-card">
  <a class="wp-card__image{{ if eq .Params.cover_style "diagram" }} wp-diagram-card{{ end }}" href="{{ .RelPermalink }}" tabindex="-1" aria-hidden="true">
    <img src="{{ printf "whitepapers/figures/%s" .Params.photo | relURL }}" alt="" width="810" height="1440" loading="lazy" decoding="async" />
  </a>
  <div class="wp-card__body">
    <p class="wp-eyebrow">{{ .Params.paper_id }}</p>
    <h3><a href="{{ .RelPermalink }}">{{ .Title }}</a></h3>
    <p>{{ .Description }}</p>
    <p class="wp-card__meta">{{ .Params.pdf_pages }} pages · {{ .Date.Format "January 2006" }} · v{{ .Params.version }}</p>
    <a class="wp-text-link" href="{{ .RelPermalink }}">Read paper <span aria-hidden="true">→</span></a>
  </div>
</article>
