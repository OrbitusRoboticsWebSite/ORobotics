{{ $page := . }}
<article class="gallery-card">
    <a href="{{ .RelPermalink }}" class="gallery-card__link" aria-label="Open {{ .Title }} archive">
        <span class="gallery-card__media">
            {{ with .Params.featured_image }}
                {{ with resources.Get . }}
                    {{ $coverSmall := .Fill "360x225 webp q76" }}
                    {{ $coverLarge := .Fill "640x400 webp q78" }}
                    <img src="{{ $coverLarge.RelPermalink }}"
                         srcset="{{ $coverSmall.RelPermalink }} 360w, {{ $coverLarge.RelPermalink }} 640w"
                         sizes="(min-width: 768px) 33vw, calc(100vw - 3rem)"
                         class="gallery-card__image"
                         width="{{ $coverLarge.Width }}"
                         height="{{ $coverLarge.Height }}"
                         loading="lazy"
                         decoding="async"
                         alt="{{ $page.Title }} gallery cover">
                {{ end }}
            {{ end }}
            {{ with .Params.event_year }}
            <span class="gallery-card__year">{{ . }}</span>
            {{ end }}
        </span>

        <span class="flex flex-1 flex-col p-6">
            <span class="flex-1">
                <h2 class="gallery-card__title m-0 text-2xl font-black">{{ $page.Title }}</h2>
                <span class="mt-3 block text-base leading-7 text-gray-600 dark:text-gray-300">{{ .Params.summary }}</span>
            </span>
            <span class="text-link mt-6">View archive <span aria-hidden="true">→</span></span>
        </span>
    </a>
</article>
