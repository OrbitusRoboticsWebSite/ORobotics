{{ $page := . }}
<article class="flex flex-col overflow-hidden rounded-xl shadow-lg bg-gray-50 dark:bg-gray-900">
    <a href="{{ .RelPermalink }}" class="block overflow-hidden" aria-label="Open {{ .Title }}">
        {{ with .Params.featured_image }}
            {{ with resources.Get . }}
                {{ $cover := .Fill "640x400 webp q78" }}
                <img src="{{ $cover.RelPermalink }}"
                     class="w-full h-auto transition-transform duration-300 hover:scale-[1.02]"
                     width="{{ $cover.Width }}"
                     height="{{ $cover.Height }}"
                     loading="lazy"
                     decoding="async"
                     alt="{{ $page.Title }} gallery cover">
            {{ end }}
        {{ end }}
    </a>
    <div class="flex flex-1 flex-col p-6">
        <div class="flex-1">
            {{ with .Params.event_year }}
            <p class="mb-2 text-sm font-extrabold tracking-widest uppercase text-primary-600 dark:text-primary-300">{{ . }} archive</p>
            {{ end }}
            <h2 class="m-0 text-2xl font-black">
                <a href="{{ $page.RelPermalink }}" class="text-gray-900 dark:text-gray-100 hover:text-primary-600 dark:hover:text-primary-300 hover:underline">
                    {{ $page.Title }}
                </a>
            </h2>
            <p class="mt-3 text-base text-gray-700 dark:text-gray-300">{{ .Params.summary }}</p>
        </div>
        <div class="flex flex-wrap gap-2 pt-5" aria-label="Tags">
            {{ range .GetTerms "tags" }}
            <a href="{{ .RelPermalink }}" class="inline-flex items-center rounded-md bg-gray-200 px-2.5 py-1 text-sm font-medium text-gray-900 hover:bg-primary-200 dark:bg-gray-700 dark:text-gray-100 dark:hover:bg-primary-700">
                {{ .LinkTitle }}
            </a>
            {{ end }}
        </div>
    </div>
</article>
