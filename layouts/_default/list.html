{{ define "main" }}
<main id="main">
    <article>
        <header class="page-banner">
            <p class="section-eyebrow section-eyebrow--light">Orbitus field journal</p>
            <h1 class="text-4xl font-black tracking-tight text-white capitalize sm:text-6xl">
                {{ .Title }}
            </h1>
        </header>
        {{ with .Content }}
        <div class="max-w-2xl px-6 mx-auto mt-6 prose dark:prose-invert dark:text-white">
            {{- . -}}
        </div>
        {{ end }}
        {{ partial "posts-template.html" . }}
    </article>
    <div class="max-w-xl mx-auto my-16">
        {{ partial "pagination" . }}
    </div>
</main>
{{ end }}
