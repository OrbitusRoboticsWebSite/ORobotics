name: Build and deploy Orbitus Robotics

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Hugo (extended)
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3.2.1
        with:
          hugo-version: "0.164.0"
          extended: true

      - name: Install dependencies (if package.json exists)
        run: |
          if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
            npm ci
          elif [ -f package.json ]; then
            npm install
          fi

      - name: Build site (prefer npm run build if available)
        shell: bash
        run: |
          set -euo pipefail
          if [ -f package.json ] && npm run | grep -qE "^[[:space:]]+build"; then
            npm run build -- --baseURL "${{ steps.pages.outputs.base_url }}/"
          else
            hugo --gc --minify --baseURL "${{ steps.pages.outputs.base_url }}/"
          fi
        env:
          HUGO_ENVIRONMENT: production
          MUSIMOTION_CLOUDKIT_API_TOKEN: ${{ secrets.MUSIMOTION_CLOUDKIT_API_TOKEN }}
          MUSIMOTION_CLOUDKIT_ENVIRONMENT: production
          ROB_CLOUDKIT_LEADERBOARD_ENABLED: ${{ vars.ROB_CLOUDKIT_LEADERBOARD_ENABLED }}

      - name: Validate optimized gallery output
        run: npm run validate

      - name: Validate project-subpath URLs
        run: npm run validate:subpath

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
