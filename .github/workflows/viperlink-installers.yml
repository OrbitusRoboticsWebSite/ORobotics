name: ViperLink minimal installers
on:
  push:
    paths: ['.gitattributes', 'scripts/viperlink/**', 'scripts/windows_bootstrap.py', 'static/v/**', 'data/viperlink*', 'tests/viperlink*', 'tests/windows*', 'layouts/viperlink/**', '.github/workflows/viperlink-installers.yml']
  pull_request:
    paths: ['.gitattributes', 'scripts/viperlink/**', 'scripts/windows_bootstrap.py', 'static/v/**', 'data/viperlink*', 'tests/viperlink*', 'tests/windows*', 'layouts/viperlink/**', '.github/workflows/viperlink-installers.yml']
permissions:
  contents: read
jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python scripts/viperlink/render.py --check
      - run: node --test tests/viperlink-portal.test.mjs
      - run: python tests/viperlink-installers.py
      - name: Verify Windows machine startup task
        if: runner.os == 'Windows'
        run: python tests/windows-machine-installers.py viperlink
