name: RedAgent installation portal
on:
  push:
    paths: ['scripts/redagent/**', 'scripts/windows_bootstrap.py', 'static/r/**', 'data/redagent*', 'tests/redagent*', 'tests/windows*', '.github/workflows/redagent-installers.yml']
  pull_request:
    paths: ['scripts/redagent/**', 'scripts/windows_bootstrap.py', 'static/r/**', 'data/redagent*', 'tests/redagent*', 'tests/windows*', '.github/workflows/redagent-installers.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
      - run: python3 scripts/redagent/render.py --check
      - run: node --test tests/redagent-portal.test.mjs
      - run: sh -n static/r/install.sh
  native-install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Test published bundle installation without launching the app
        run: python tests/redagent-installers.py
      - name: Reproduce Restricted policy and check the Windows machine install
        if: runner.os == 'Windows'
        run: |
          python tests/windows-bootstrap.py
          python tests/windows-machine-installers.py redagent
