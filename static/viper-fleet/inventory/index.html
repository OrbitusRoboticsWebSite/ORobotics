<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive"><meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.apple-cloudkit.com; connect-src 'self' https://*.apple-cloudkit.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.apple.com https://*.icloud.com; frame-src https://*.apple.com https://*.icloud.com; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Developer inventory · Orbitus Robotics</title>
  <link rel="icon" href="../viper-link.png"><link rel="stylesheet" href="../portal.css">
  <script type="module" src="./portal.mjs"></script>
</head>
<body>
  <header class="topbar"><a class="brand" href="../"><img src="../viper-link.png" width="48" height="48" alt=""><span>VIPER <b>FLEET</b><small>ORBITUS ROBOTICS</small></span></a></header>
  <main class="inventory-page">
    <section class="intro">
      <div><h1>Developer inventory</h1><p class="lede">View Mac check-ins from your group in the Orbitus inventory container.</p></div>
      <aside class="access-card"><h2>Administrator access</h2>
        <p id="connection" role="status">The inventory connection is pending.</p>
        <div id="inventory-sign-in"></div><div id="inventory-sign-out"></div>
      </aside>
    </section>
    <section class="fleet-panel" aria-labelledby="reports-heading">
      <div class="panel-heading"><h2 id="reports-heading">Group reports</h2></div>
      <form id="group-form" class="panel-heading" hidden autocomplete="off">
        <label for="group">Group code<input id="group" maxlength="24" spellcheck="false" autocapitalize="none" autocomplete="off" required></label>
        <button type="submit" class="primary">Load reports</button>
      </form>
      <p id="result" class="results" role="status">No reports loaded.</p>
      <div class="table-wrap" id="report-table" hidden><table><caption class="sr-only">Mac status reports</caption>
        <thead><tr><th scope="col">Mac</th><th scope="col">macOS</th><th scope="col">Agent</th><th scope="col">Last check-in</th></tr></thead>
        <tbody id="rows"></tbody>
      </table></div>
    </section>
  </main>
</body>
</html>
